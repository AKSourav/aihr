name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.5"
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/unit
        env:
          PYTHONPATH: .:./packages

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.5"
      - run: uv sync --frozen --group dev
      - run: uvx pyright@latest
