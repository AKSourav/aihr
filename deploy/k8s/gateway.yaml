apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aihr
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: api.aihr.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: aihr-api-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aihr-api
spec:
  parentRefs:
    - name: aihr
  hostnames:
    - api.aihr.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tenants
        - path:
            type: PathPrefix
            value: /accounts
        - path:
            type: PathPrefix
            value: /platform
        - path:
            type: Exact
            value: /me
        - path:
            type: Exact
            value: /organizations
      backendRefs:
        - name: aihr-api
          port: 8000
---
# Candidate-facing invite pages, and signup. Deliberately outside aihr-authn: neither a candidate
# nor someone signing up has a Keycloak account yet. For invites the signed token in the path is
# the credential; signup has none, and relies on the rate limit below.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aihr-public
spec:
  parentRefs:
    - name: aihr
  hostnames:
    - api.aihr.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /join/
        - path:
            type: PathPrefix
            value: /public/invites/
        - path:
            type: Exact
            value: /signup
      backendRefs:
        - name: aihr-api
          port: 8000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: aihr-authn
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aihr-api
  jwt:
    providers:
      - name: keycloak
        issuer: https://keycloak.aihr.example.com/realms/aihr
        audiences:
          - aihr-api
        remoteJWKS:
          uri: https://keycloak.aihr.example.com/realms/aihr/protocol/openid-connect/certs
        claimToHeaders:
          - claim: sub
            header: x-jwt-sub
        recomputeRoute: false
  extAuth:
    failOpen: false
    grpc:
      backendRefs:
        - name: opa
          port: 9191
    headersToExtAuth:
      - x-jwt-sub
      - authorization
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: aihr-ratelimit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aihr-api
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aihr-public
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                value: 0.0.0.0/0
                type: Distinct
          limit:
            requests: 120
            unit: Minute
