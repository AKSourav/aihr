services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: hr
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d hr"]
      interval: 5s
      retries: 10

  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes: [keycloakdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]
    volumes:
      - "./deploy/dev/realm-aihr-local.json:/opt/keycloak/data/import/realm-aihr-local.json:ro"
    depends_on:
      keycloak-db: { condition: service_healthy }

  temporal-init:
    image: busybox
    command: chown -R 1000:1000 /data
    volumes: [temporaldata:/data]

  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    ports: ["7233:7233", "8233:8233"]
    volumes: [temporaldata:/data]
    depends_on:
      temporal-init: { condition: service_completed_successfully }

  minio:
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: chainguard/minio:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 &&
             mc alias set local http://minio:9000 minio minio12345 &&
             mc mb -p local/hr-artifacts &&
             (mc ilm rule remove --all --force local/hr-artifacts || true) &&
             mc ilm rule add --expire-days 90 --prefix 'transcripts/' local/hr-artifacts"

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
    ports: ["${API_PORT:-8000}:8000"]

  temporal-worker:
    build: { context: ., dockerfile: services/temporal_worker/Dockerfile }
    env_file: .env
    depends_on: [postgres, temporal, minio]

  agent-worker:
    build: { context: ., dockerfile: services/agent/Dockerfile }
    profiles: ["agent"]
    env_file: .env
    depends_on: [api]

volumes:
  pgdata:
  keycloakdata:
  temporaldata:
  miniodata:
