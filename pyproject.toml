[project]
name = "aihr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.55",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "temporalio==1.34.0",
    "boto3==1.43.118",
    "livekit-agents==1.8.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
]
